name: Build

# Every push: run the tests, build NetMeter.exe + the installer on Windows, run the app
# for real on that Windows machine (self-test) and keep the files as a download.
# Pushing a tag like v2.1.0 also publishes them as a GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install psutil pillow pytest
      - name: Tests
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          pytest -q tests

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        shell: bash
        run: |
          base=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('netmeter/config.py').read())[1])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$base" ]]; then
              echo "::error::Tag v$tag doesn't match VERSION = \"$base\" in netmeter/config.py"
              exit 1
            fi
            ver="$base"
          else
            ver="$base-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "NETMETER_VERSION=$ver" >> "$GITHUB_ENV"
          echo "NETMETER_NUMVERSION=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building NetMeter $ver"

      - name: Install build tools
        run: pip install psutil pystray pillow pyinstaller

      - name: Build NetMeter.exe
        run: |
          python packaging/make_icon.py
          pyinstaller --noconfirm --onefile --windowed --name NetMeter --icon netmeter.ico --hidden-import pystray._win32 run.py

      - name: Run it on this Windows machine (self-test)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-test.json"
          $p = Start-Process -FilePath "dist\NetMeter.exe" -ArgumentList "--self-test", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "NetMeter didn't finish its self-test in 90 s" }
          if (-not (Test-Path $report)) {
            Get-Content "$env:APPDATA\NetMeter\netmeter.log" -ErrorAction SilentlyContinue
            throw "NetMeter exited without writing its self-test report"
          }
          Get-Content $report
          $r = Get-Content $report -Raw | ConvertFrom-Json
          if ($r.errors.Count -gt 0) { throw "NetMeter logged errors during the self-test" }
          Copy-Item $report dist\
          $png = [IO.Path]::ChangeExtension($report, ".png")
          if (Test-Path $png) { Copy-Item $png dist\ }
          Copy-Item "$env:APPDATA\NetMeter\netmeter.log" dist\self-test.log -ErrorAction SilentlyContinue

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc packaging\netmeter.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "dist\NetMeter-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist\NetMeter.exe, README.md $dir
          Copy-Item plugin-examples, skin-examples $dir -Recurse
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\NetMeter-portable-$env:NETMETER_VERSION.zip" -Force

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: NetMeter-${{ env.NETMETER_VERSION }}
          path: |
            dist/NetMeter-Setup-*.exe
            dist/NetMeter-portable-*.zip
            dist/self-test.*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/NetMeter-Setup-$NETMETER_VERSION.exe" \
            "dist/NetMeter-portable-$NETMETER_VERSION.zip" \
            --title "NetMeter $NETMETER_VERSION" \
            --notes-file packaging/release-notes.md
